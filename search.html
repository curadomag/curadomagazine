")},false)}};/*]]>*/</script><div id="curado-search"><button id="curado-search-close" aria-label="Cerrar">&times;</button> <input id="curado-search-input" type="text" placeholder="Buscar" autocomplete="off"><div id="curado-search-results"></div></div><script>window.curadoSearchLoaded = true;
(function () {
  function init() {
    window.curadoSearchInit = true;
    var overlay = document.getElementById('curado-search');
    var input   = document.getElementById('curado-search-input');
    var results = document.getElementById('curado-search-results');
    var closeBtn= document.getElementById('curado-search-close');
    if (!overlay) return;

    var data = null, loading = false;

    function open() {
      overlay.classList.add('is-open');
      document.body.style.overflow = 'hidden';
      setTimeout(function(){ input.focus(); }, 60);
      if (!data && !loading) {
        loading = true;
        fetch('/feed.json').then(function(r){ return r.json(); })
          .then(function(j){ data = j.items || []; loading = false; render(input.value); })
          .catch(function(){ loading = false; });
      }
    }
    function close() {
      overlay.classList.remove('is-open');
      document.body.style.overflow = '';
    }
    function strip(s) {
      return (s || '').replace(/<[^>]*>/g, ' ')
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }
    function render(q) {
      var term = strip(q).trim();
      if (!term) { results.innerHTML = ''; return; }
      if (!data) { results.innerHTML = '<p class="cs-msg">Cargando…</p>'; return; }
      var hits = data.map(function (it) {
        var s = 0;
        if (strip(it.title).indexOf(term) !== -1) s += 10;
        if (strip(it.content_html).indexOf(term) !== -1) s += 1;
        return { item: it, score: s };
      }).filter(function (h) { return h.score > 0; })
        .sort(function (a, b) { return b.score - a.score; });
      if (!hits.length) { results.innerHTML = '<p class="cs-msg">Sin resultados</p>'; return; }
      results.innerHTML = hits.map(function (h) {
        var it = h.item;
        var img = it.image ? '<img src="' + it.image + '" alt="">' : '';
        return '<a class="cs-hit" href="' + it.url + '">' + img + '<span>' + it.title + '</span></a>';
      }).join('');
    }

    // Esconde el botón del tema y pone el nuestro
    var themeBtn = document.querySelector('.search-btn');
    if (themeBtn) {
      themeBtn.style.display = 'none';
      var myBtn = document.createElement('button');
      myBtn.id = 'curado-lupa';
      myBtn.setAttribute('aria-label', 'Buscar');
      myBtn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg>';
      myBtn.addEventListener('click', open);
      themeBtn.parentNode.insertBefore(myBtn, themeBtn);
    }

    closeBtn.addEventListener('click', close);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

    var t;
    input.addEventListener('input', function () {
      clearTimeout(t);
      t = setTimeout(function(){ render(input.value); }, 120);
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ setTimeout(init, 400); });
  } else { setTimeout(init, 400); }
})();</script></body></html>
